<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bedside.tools</title>
<meta name="description" content="Quick clinical references, calculators and practice drills for residents and students.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBFBFA" id="themeColor">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232B4BDB'/%3E%3Cpath d='M16 9v14M9 16h14' stroke='white' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E">
<script src="/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBFBFA; --card:#FFFFFF; --ink:#111113; --muted:#55555D; --line:#ECECEE; --field:#DCDCE0;
    --accent:#2B4BDB; --accent-ink:#FFFFFF; --soft:#F1F1F3; --mark:#FFF1B8;
    --feat-bg:#111113; --feat-ink:#FFFFFF; --feat-muted:#D4D4D8; --feat-eyebrow:#C9D2FF;
    --c-cards:#1D3FC4; --c-renal:#0F6B5E; --c-endo:#9A3412; --c-heme:#A61E4D; --c-id:#6D28D9;
    --c-icu:#0B6577; --c-gi:#7A5200; --c-onc:#3F3F46; --c-other:#3F3F46;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:light;
  }
  /* Dark values, used when the system is dark (unless Light is chosen) or when Dark is chosen. */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0F0F11; --card:#1A1A1E; --ink:#F2F2F3; --muted:#A6A6AE; --line:#2A2A30; --field:#3A3A42;
      --accent:#AFBEFF; --accent-ink:#0F0F11; --soft:#232328; --mark:#5C4A00;
      --feat-bg:#232B52; --feat-ink:#FFFFFF; --feat-muted:#C9CCDA; --feat-eyebrow:#AFBEFF;
      --c-cards:#AFBEFF; --c-renal:#6FD3C0; --c-endo:#F4A97B; --c-heme:#FF9DB5; --c-id:#C9B0FF;
      --c-icu:#7DD3E8; --c-gi:#E8C56A; --c-onc:#D4D4D8; --c-other:#D4D4D8;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F0F11; --card:#1A1A1E; --ink:#F2F2F3; --muted:#A6A6AE; --line:#2A2A30; --field:#3A3A42;
    --accent:#AFBEFF; --accent-ink:#0F0F11; --soft:#232328; --mark:#5C4A00;
    --feat-bg:#232B52; --feat-ink:#FFFFFF; --feat-muted:#C9CCDA; --feat-eyebrow:#AFBEFF;
    --c-cards:#AFBEFF; --c-renal:#6FD3C0; --c-endo:#F4A97B; --c-heme:#FF9DB5; --c-id:#C9B0FF;
    --c-icu:#7DD3E8; --c-gi:#E8C56A; --c-onc:#D4D4D8; --c-other:#D4D4D8;
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 20px}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .eyebrow{margin:0;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:6px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;min-height:44px}
  .mark{width:22px;height:22px;border-radius:6px;background:#2B4BDB;display:inline-flex;align-items:center;justify-content:center}
  .head-right{display:flex;align-items:center;gap:4px}
  .navlink{min-height:44px;padding:0 10px;display:inline-flex;align-items:center;font-size:14px;font-weight:500;color:var(--muted);border-radius:8px}
  .navlink[aria-current="page"]{color:var(--ink)}
  .icon-btn{width:44px;height:44px;border:0;background:transparent;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
  .icon-btn .moon{display:none}
  :root[data-theme="dark"] .icon-btn .sun{display:none}
  :root[data-theme="dark"] .icon-btn .moon{display:block}
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]) .icon-btn .sun{display:none}
    :root:not([data-theme="light"]) .icon-btn .moon{display:block}
  }

  /* Search bar: directly under the header on every screen size. */
  .searchbar{padding:4px 20px 0}
  .search{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 16px;border:1px solid var(--field);border-radius:999px;background:var(--card);max-width:1080px;margin:0 auto}
  .search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
  .search svg{flex:none;color:var(--muted)}
  .search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink)}
  .search input:focus{outline:none}
  .search input::-webkit-search-cancel-button{display:none}
  .clear{width:38px;height:38px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
  .clear[hidden]{display:none}

  #main{padding-top:10px}
  .stack{display:flex;flex-direction:column;gap:20px}

  .shifts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px;max-width:520px}
  .shift{height:44px;border-radius:10px;border:1px solid var(--field);background:var(--card);font-size:14px;font-weight:500;cursor:pointer}
  .shift[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  .feat{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:16px;background:var(--feat-bg);color:var(--feat-ink)}
  .feat .eyebrow{color:var(--feat-eyebrow)}
  .feat .name{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
  .feat .desc{font-size:14px;color:var(--feat-muted)}

  .tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
  .tile{min-height:76px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
  .tile .name{font-size:15px;font-weight:600;line-height:1.25;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
  .tile .desc{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  a.tile:hover,a.row:hover{border-color:var(--field)}
  .soon{flex:none;font-family:var(--mono);font-size:10px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 5px;letter-spacing:.02em}
  [aria-disabled="true"] .name>span:first-child,[aria-disabled="true"] .desc{opacity:.62}

  .all-link{min-height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:15px;font-weight:500}

  .chips{position:sticky;top:0;z-index:4;display:flex;gap:8px;overflow-x:auto;padding:8px 20px 10px;margin:0 -20px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:var(--card);font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
  .spec{scroll-margin-top:72px}
  .spec h2{margin:0;padding:18px 0 8px;display:flex;align-items:baseline;justify-content:space-between;font-size:13px;font-weight:600}
  .spec h2 .n{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted)}
  .rows{display:grid;grid-template-columns:minmax(0,1fr);background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .row{min-height:58px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line)}
  .rows>.row:last-child{border-bottom:0}
  .row .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
  .row .name{font-size:16px;font-weight:500}
  .row .desc{font-size:13px;color:var(--muted)}
  .row .tag{flex:none;font-family:var(--mono);font-size:11px;color:var(--muted)}
  mark{background:var(--mark);color:inherit;border-radius:2px}
  .empty{padding:36px 16px;text-align:center;border:1px dashed var(--field);border-radius:14px;color:var(--muted);font-size:15px}
  .hint{margin:0;font-size:13px;color:var(--muted)}

  footer{margin-top:40px;border-top:1px solid var(--line)}
  footer .wrap{padding-top:20px;padding-bottom:24px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-start;font-size:13px;color:var(--muted)}
  .disc{flex:1 1 280px;max-width:620px}
  .disc summary{min-height:44px;display:inline-flex;align-items:center;gap:8px;font-weight:500;color:var(--ink);cursor:pointer;list-style:none}
  .disc summary::-webkit-details-marker{display:none}
  .disc summary::after{content:"";width:7px;height:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .15s}
  .disc[open] summary::after{transform:rotate(225deg) translateY(-2px)}
  .disc ul{margin:4px 0 8px;padding:0;list-style:none;display:grid;gap:10px}
  .disc li{line-height:1.45}
  .disc li b{display:block;font-weight:600;color:var(--ink)}
  .theme{display:inline-grid;grid-template-columns:repeat(3,auto);gap:4px;padding:4px;background:var(--soft);border-radius:12px}
  .theme button{height:36px;min-width:60px;padding:0 12px;border:0;border-radius:9px;background:transparent;font-size:13px;font-weight:500;color:var(--muted);cursor:pointer}
  .theme button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.14)}

  @media (min-width:800px){
    .searchbar{padding:6px 20px 0}
    .search{border-radius:14px}
    #main{padding-top:28px}
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
    .home{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:32px;align-items:start}
    .feat{padding:28px}
    .feat .name{font-size:30px}
    .rows{grid-template-columns:repeat(2,minmax(0,1fr))}
    .rows>.row{border-bottom:1px solid var(--line)}
    .chips{flex-wrap:wrap;overflow:visible}
    .spec{scroll-margin-top:130px}
  }
  @media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="#home">
      <span class="mark" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      bedside.tools
    </a>
    <div class="head-right">
      <nav aria-label="Primary">
        <a class="navlink" id="navHome" href="#home">Home</a>
        <a class="navlink" id="navAll" href="#all">All tools</a>
      </nav>
      <button class="icon-btn" data-theme-flip type="button" aria-label="Switch between light and dark">
        <svg class="sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="searchbar">
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="sr">Search tools</span>
    <input id="q" type="search" placeholder="Search" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
    <button class="clear" id="clear" type="button" aria-label="Clear search" hidden>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </label>
</div>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <details class="disc">
      <summary>Disclaimers</summary>
      <ul>
        <li><b>Education only</b>Not a substitute for clinical judgment.</li>
        <li><b>Verify</b>Check anything you act on against primary sources.</li>
        <li><b>Privacy</b>Everything runs in your browser. Don't enter patient identifiers.</li>
      </ul>
    </details>
    <div class="theme" role="group" aria-label="Theme">
      <button type="button" data-theme-set="auto">Auto</button>
      <button type="button" data-theme-set="light">Light</button>
      <button type="button" data-theme-set="dark">Dark</button>
    </div>
  </div>
</footer>

<script>
  /* ── Tool list ────────────────────────────────────────────────────────────
     To publish a tool: put it at /<slug>/index.html and set live: true here.
     sections: places inside the tool that search can jump to ([label, anchor id]).
     keys: extra words search should match. */
  const TOOLS = [
    { slug:'electrolytes', name:'Electrolyte repletion', desc:'K, Mg, Phos, Ca dosing and rechecks', spec:'Nephrology', live:true,
      sections:[['Potassium repletion','k'],['Magnesium repletion','mg'],['Phosphorus repletion','phos'],['Calcium and albumin correction','ca']], keys:'potassium magnesium phosphorus phosphate calcium hypokalemia hypomagnesemia hypophosphatemia hypocalcemia lytes' },
    { slug:'hyponatremia', name:'Hyponatremia', desc:'Workup and correction limit', spec:'Nephrology', keys:'sodium SIADH ODS' },
    { slug:'aki', name:'AKI workup', desc:'Staging, FENa or FEUrea, drugs to hold', spec:'Nephrology', keys:'creatinine kidney renal' },

    { slug:'gdmt', name:'GDMT for heart failure', desc:'Start, titrate, monitor', spec:'Cardiology', keys:'HFrEF ARNI SGLT2 beta blocker MRA' },
    { slug:'afib', name:'Atrial fibrillation', desc:'Anticoagulation, rapid AF, cardioversion', spec:'Cardiology', live:true,
      sections:[['CHA₂DS₂-VASc and anticoagulation decision','chadsvasc'],['Valve check: warfarin instead of a DOAC','valve'],['DOAC dose by kidney function','doses'],['HAS-BLED bleeding risk','hasbled'],['Practice cases','practice'],['Rapid AF rate control','rvr'],['IV rate-control doses','rate-doses'],['Cardioversion timing and anticoagulation','cardioversion'],['Rate or rhythm control, ablation','rhythm'],['Left atrial appendage occlusion','laao'],['Device-detected AF','device']], keys:'AF AFib CHA2DS2-VASc apixaban rivaroxaban dabigatran edoxaban warfarin RVR diltiazem metoprolol digoxin amiodarone WPW Watchman' },
    { slug:'chest-pain', name:'Chest pain', desc:'hs-troponin pathways and HEART', spec:'Cardiology', keys:'ACS troponin' },
    { slug:'ekg-cath', name:'EKG emergencies', desc:'When to call cath', spec:'Cardiology', live:true,
      sections:[['60-second occlusion read','read'],['ST-elevation thresholds','thresholds'],['Leads to territory and culprit','territories'],['Pattern library','patterns'],['Cath timing tier','call'],['Call script','script-h'],['Smith-modified Sgarbossa calculator','sgarbossa'],['ST-elevation threshold lookup','ste-lookup'],['Practice cases','practice']], keys:'ECG STEMI OMI occlusion posterior de Winter Wellens hyperacute LBBB paced pericarditis hyperkalemia VT heart block aVR cath lab activation' },
    { slug:'qtc', name:'QT risk checker', desc:'QTc and drug list', spec:'Cardiology', keys:'torsades' },
    { slug:'cardio-onc', name:'Cardio-oncology', desc:'Surveillance by regimen', spec:'Cardiology', keys:'anthracycline trastuzumab myocarditis' },

    { slug:'insulin', name:'Insulin management', desc:'Inpatient dosing and adjustment', spec:'Endocrine', keys:'glucose diabetes basal bolus' },
    { slug:'dka', name:'DKA & HHS', desc:'Fluids, potassium gate, drip to subQ', spec:'Endocrine', keys:'ketoacidosis hyperglycemia' },
    { slug:'steroids', name:'Steroid conversion', desc:'Equivalents and stress dosing', spec:'Endocrine', keys:'prednisone hydrocortisone dexamethasone' },

    { slug:'vte-ppx', name:'VTE prophylaxis', desc:'Risk scores to a recommendation', spec:'Hematology', keys:'DVT Padua IMPROVE enoxaparin' },
    { slug:'vte-treatment', name:'VTE treatment', desc:'Agent, dose, duration, switching', spec:'Hematology', keys:'DVT PE DOAC heparin' },
    { slug:'anticoag-periop', name:'Holding anticoagulants', desc:'Before procedures, and restarting', spec:'Hematology', keys:'DOAC warfarin bridging periprocedural' },
    { slug:'reversal', name:'Anticoagulant reversal', desc:'Bleeding on anticoagulation', spec:'Hematology', keys:'PCC vitamin K idarucizumab andexanet protamine' },
    { slug:'hit', name:'Suspected HIT', desc:'4T score, testing, what to switch to', spec:'Hematology', keys:'heparin thrombocytopenia' },
    { slug:'transfusion', name:'Transfusion thresholds', desc:'By situation, with the trial', spec:'Hematology', keys:'blood platelets hemoglobin' },

    { slug:'abx-empiric', name:'Empiric antibiotics', desc:'By syndrome, with de-escalation', spec:'Infectious disease', keys:'pneumonia UTI cellulitis sepsis' },
    { slug:'abx-spectrum', name:'Antibiotic spectrum map', desc:'What each drug covers and misses', spec:'Infectious disease', keys:'coverage MRSA pseudomonas' },

    { slug:'pressors', name:'Pressors & inotropes', desc:'Chooser, doses, weaning', spec:'Critical care', keys:'shock norepinephrine vasopressin' },
    { slug:'vent', name:'Ventilator basics', desc:'Set up, assess, troubleshoot, liberate', spec:'Critical care', keys:'ARDS PEEP tidal volume' },
    { slug:'acid-base', name:'Acid–base interpreter', desc:'Compensation, gap, delta-delta', spec:'Critical care', keys:'ABG anion gap acidosis alkalosis' },

    { slug:'cirrhosis', name:'Decompensated cirrhosis', desc:'Scores, ascites, bleed, HRS, HE', spec:'GI & liver', keys:'MELD SBP paracentesis varices' },
    { slug:'onc-emergencies', name:'Neutropenic fever & TLS', desc:'First-hour actions', spec:'Oncology', keys:'tumor lysis febrile neutropenia' },
    { slug:'opioids', name:'Opioid conversion', desc:'With cross-tolerance reduction', spec:'Palliative care', keys:'morphine MME pain' },
    { slug:'preop', name:'Pre-op evaluation', desc:'Risk and medication management', spec:'Perioperative', keys:'surgery RCRI clearance' },
    { slug:'birth-control', name:'Birth control', desc:'Eligibility, quick guide, cases', spec:"Women's health", keys:'contraception MEC' },

    { slug:'cross-cover', name:'Cross-cover', desc:'What to check and order for each overnight page', spec:'Ward workflow', keys:'pager night call' },
    { slug:'rrt', name:'Code cards', desc:'ACLS doses, push-dose pressors', spec:'Ward workflow', keys:'rapid response code blue anaphylaxis' },

    { slug:'ccs-sim', name:'CCS case simulator', desc:'Step 3 practice cases', spec:'Learn', keys:'USMLE' },
    { slug:'trials', name:'Landmark trials', desc:'Flashcards by specialty', spec:'Learn', keys:'evidence' },
    { slug:'drills', name:'Lab & ECG drills', desc:'Pattern recognition with explanations', spec:'Learn', keys:'practice' }
  ];

  /* Which tools each rotation shows first. The first live tool in a list is featured. */
  const SHIFTS = {
    wards:  { label:'Wards',  tools:['electrolytes','insulin','aki','hyponatremia','chest-pain','afib','vte-ppx','anticoag-periop','abx-empiric'] },
    nights: { label:'Nights', tools:['cross-cover','rrt','electrolytes','insulin','chest-pain','ekg-cath','afib','hyponatremia','reversal','onc-emergencies'] },
    icu:    { label:'ICU',    tools:['pressors','vent','dka','acid-base','electrolytes','rrt','ekg-cath','abx-empiric','reversal','cirrhosis'] },
    clinic: { label:'Clinic', tools:['gdmt','birth-control','preop','afib','cardio-onc','anticoag-periop','vte-treatment'] }
  };

  const SPEC_COLOR = { 'Cardiology':'cards','Nephrology':'renal','Endocrine':'endo','Hematology':'heme','Infectious disease':'id','Critical care':'icu','GI & liver':'gi','Oncology':'onc' };
  const bySlug = Object.fromEntries(TOOLS.map(t => [t.slug, t]));
  const main = document.getElementById('main');
  const q = document.getElementById('q');
  const clearBtn = document.getElementById('clear');
  const store = {
    get(k){ try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
  };
  let shift = SHIFTS[store.get('bt-shift')] ? store.get('bt-shift') : 'wards';

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const hl = (text, term) => {
    const i = term ? text.toLowerCase().indexOf(term) : -1;
    return i < 0 ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + term.length)) + '</mark>' + esc(text.slice(i + term.length));
  };
  const chevron = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
  const soon = '<span class="soon">Soon</span>';
  // Live tools are links; tools not built yet are shown but not clickable.
  const open = (t, cls, hash) => t.live ? `<a class="${cls}" href="/${t.slug}/${hash ? '#' + hash : ''}">` : `<div class="${cls}" aria-disabled="true">`;
  const close = t => t.live ? '</a>' : '</div>';

  function row(t, term, right){
    return `${open(t, 'row')}<span class="txt"><span class="name"><span>${hl(t.name, term)}</span></span><span class="desc">${hl(t.desc, term)}</span></span>${t.live ? (right || '') : soon}${close(t)}`;
  }

  function renderHome(){
    const list = SHIFTS[shift].tools.map(s => bySlug[s]).filter(Boolean);
    const feat = list.find(t => t.live) || list[0];
    const rest = list.filter(t => t !== feat).sort((a, b) => (b.live ? 1 : 0) - (a.live ? 1 : 0)).slice(0, 6);
    main.innerHTML = `<div class="home stack">
      <div class="stack">
        <div>
          <p class="eyebrow">I'm on</p>
          <div class="shifts" role="group" aria-label="Current rotation">
            ${Object.entries(SHIFTS).map(([k, v]) => `<button class="shift" type="button" data-shift="${k}" aria-pressed="${k === shift}">${v.label}</button>`).join('')}
          </div>
        </div>
        ${open(feat, 'feat')}
          <span class="eyebrow">${feat.live ? 'Start here' : 'Coming soon'}</span>
          <span class="name">${esc(feat.name)}</span>
          <span class="desc">${esc(feat.desc)}</span>
        ${close(feat)}
      </div>
      <div class="stack">
        <section>
          <h2 class="eyebrow">For ${esc(SHIFTS[shift].label.toLowerCase())}</h2>
          <div class="tiles">
            ${rest.map(t => `${open(t, 'tile')}<span class="name"><span>${esc(t.name)}</span>${t.live ? '' : soon}</span><span class="desc">${esc(t.desc)}</span>${close(t)}`).join('')}
          </div>
        </section>
        <a class="all-link" href="#all">All ${TOOLS.length} tools ${chevron}</a>
      </div>
    </div>`;
  }

  function renderAll(){
    const specs = [...new Set(TOOLS.map(t => t.spec))];
    main.innerHTML = `<nav class="chips" aria-label="Jump to specialty">
        ${specs.map((s, i) => `<button class="chip" type="button" data-jump="spec-${i}">${esc(s)}</button>`).join('')}
      </nav>
      ${specs.map((s, i) => {
        const items = TOOLS.filter(t => t.spec === s);
        return `<section class="spec" id="spec-${i}">
          <h2 style="color:var(--c-${SPEC_COLOR[s] || 'other'})"><span>${esc(s)}</span><span class="n">${items.length}</span></h2>
          <div class="rows">${items.map(t => row(t, '')).join('')}</div>
        </section>`;
      }).join('')}`;
  }

  function renderSearch(term){
    const hay = t => (t.name + ' ' + t.desc + ' ' + t.spec + ' ' + (t.keys || '')).toLowerCase();
    const score = t => (t.name.toLowerCase().startsWith(term) ? 0 : t.name.toLowerCase().includes(term) ? 1 : 2) + (t.live ? 0 : 0.5);
    const tools = TOOLS.filter(t => hay(t).includes(term)).sort((a, b) => score(a) - score(b));
    const sections = [];
    TOOLS.forEach(t => (t.sections || []).forEach(([label, id]) => { if (label.toLowerCase().includes(term)) sections.push({ t, label, id }); }));
    if (!tools.length && !sections.length){
      main.innerHTML = `<div class="empty">Nothing matches “${esc(term)}”.</div>`;
      return;
    }
    main.innerHTML = `<div class="stack">
      ${tools.length ? `<section><h2 class="eyebrow" style="padding-bottom:8px">Tools</h2><div class="rows">${tools.map(t => row(t, term, `<span class="tag">${esc(t.spec)}</span>`)).join('')}</div></section>` : ''}
      ${sections.length ? `<section><h2 class="eyebrow" style="padding-bottom:8px">Jump to a section</h2><div class="rows">${sections.map(s =>
        `${open(s.t, 'row', s.id)}<span class="txt"><span class="name"><span>${hl(s.label, term)}</span></span><span class="desc">in ${esc(s.t.name)}</span></span>${s.t.live ? chevron : soon}${close(s.t)}`).join('')}</div></section>` : ''}
      <p class="hint">Search matches tool names, what they cover, and sections inside each tool.</p>
    </div>`;
  }

  function render(){
    const term = q.value.trim().toLowerCase();
    clearBtn.hidden = !q.value;
    const all = location.hash === '#all';
    document.getElementById('navHome').toggleAttribute('aria-current', !all && !term);
    document.getElementById('navAll').toggleAttribute('aria-current', all && !term);
    if (!all && !term) document.getElementById('navHome').setAttribute('aria-current', 'page');
    if (all && !term) document.getElementById('navAll').setAttribute('aria-current', 'page');
    if (term) renderSearch(term); else if (all) renderAll(); else renderHome();
  }

  main.addEventListener('click', e => {
    const s = e.target.closest('[data-shift]');
    if (s){ shift = s.dataset.shift; store.set('bt-shift', shift); renderHome(); main.querySelector('[data-shift="' + shift + '"]').focus(); return; }
    const j = e.target.closest('[data-jump]');
    if (j){ const el = document.getElementById(j.dataset.jump); if (el) el.scrollIntoView({ block:'start' }); }
  });
  q.addEventListener('input', () => { render(); window.scrollTo(0, 0); });
  clearBtn.addEventListener('click', () => { q.value = ''; render(); q.focus(); });
  window.addEventListener('hashchange', () => { q.value = ''; render(); window.scrollTo(0, 0); });
  document.querySelectorAll('.navlink, .brand').forEach(a => a.addEventListener('click', () => { if (q.value){ q.value = ''; render(); } }));
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); }
    else if (e.key === 'Escape' && document.activeElement === q){ q.value = ''; render(); q.blur(); }
  });

  render();
</script>
</body>
</html>
